name: Build LEDE Nokia XG-040G-TF

on:
  workflow_dispatch:
    inputs:
      device:
        description: "机型 profile"
        required: true
        default: "nokia_xg-040g-tf-ubi"
        type: choice
        options:
          - nokia_xg-040g-tf-ubi
          - nokia_xg-040g-md-ubi
      packages:
        description: "额外包（逗号分隔，留空只编设备默认）"
        required: false
        default: "luci-app-airoha-npu,airoha-en7581-npu-firmware,luci-app-upnp,luci-app-lucky"
        type: string
      make_release:
        description: "编译成功后创建 Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-lede-${{ inputs.device }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h / | tail -1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd xz-utils zlib1g-dev

      - name: Clone LEDE master
        run: |
          git clone --depth 1 https://github.com/coolsnowwolf/lede openwrt
          cd openwrt && git log -1 --format='LEDE HEAD: %h %ci %s'

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: lede-dl-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            lede-dl-${{ inputs.device }}-

      - name: Generate .config
        working-directory: openwrt
        env:
          DEVICE: ${{ inputs.device }}
          EXTRA: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          : > .config
          {
            echo "CONFIG_TARGET_airoha=y"
            echo "CONFIG_TARGET_airoha_an7581=y"
            echo "CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y"
            echo "CONFIG_PACKAGE_luci=y"
            echo "CONFIG_PACKAGE_luci-base=y"
            echo "CONFIG_TARGET_ROOTFS_SQUASHFS=y"
          } >> .config
          if [ -n "${EXTRA:-}" ]; then
            IFS=',' read -ra PKGS <<< "$EXTRA"
            for p in "${PKGS[@]}"; do
              p="$(printf '%s' "$p" | tr -d '[:space:]')"
              [ -z "$p" ] && continue
              echo "CONFIG_PACKAGE_${p}=y" >> .config
            done
          fi
          make defconfig
          echo "===== 机型校验 ====="
          grep -E "^CONFIG_TARGET_airoha_an7581_DEVICE_${DEVICE}=y" .config \
            || { echo "::error::机型未被选中 ${DEVICE}"; exit 1; }
          grep -E "^CONFIG_TARGET_airoha_an7581_DEVICE_PACKAGES_${DEVICE}=" .config || true
          echo "===== 插件校验 ====="
          grep -E "^CONFIG_PACKAGE_(luci-app-airoha-npu|airoha-en7581-npu-firmware|luci-app-upnp|luci-app-lucky|luci-app-pon)=y" .config || true

      - name: Download package sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Compile firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp -v openwrt/bin/targets/airoha/an7581/*.itb out/ 2>/dev/null || true
          cp -v openwrt/bin/targets/airoha/an7581/sha256sums out/ 2>/dev/null || true
          cp -v openwrt/bin/targets/airoha/an7581/profiles.json out/ 2>/dev/null || true
          cp -v openwrt/.config out/config.txt 2>/dev/null || true
          cp -v openwrt/build.log out/build.log 2>/dev/null || true
          ( cd out && sha256sum *.itb > SHA256SUMS.txt 2>/dev/null || true )
          ls -lh out || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lede-${{ inputs.device }}
          path: out
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release
        if: inputs.make_release && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tf-${{ github.run_number }}
          name: LEDE ${{ inputs.device }} #${{ github.run_number }}
          body: |
            机型：`${{ inputs.device }}`
            插件：`${{ inputs.packages }}`
            源码：coolsnowwolf/lede master（本次全新克隆）
            产物：`*-recovery.itb`（U-Boot recovery 内存运行）、`*-sysupgrade.itb`（写入 flash）
          files: |
            out/*.itb
            out/SHA256SUMS.txt
